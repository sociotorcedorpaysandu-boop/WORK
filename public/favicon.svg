<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32" fill="none">
  <!-- Fundo sutil arredondado para contraste perfeito em temas claro e escuro -->
  <rect width="100" height="100" rx="20" fill="#111111" />
  
  <!-- Coluna Esquerda Corpo -->
  <polygon points="12,25 22,21 32,25 32,80 12,80" fill="#ECA580" />
  <!-- Coluna Esquerda Topo Inclinado -->
  <polygon points="12,25 22,21 32,25 22,28" fill="#D35400" />

  <!-- Primeira Viga Diagonal (Laranja Oficial Work) -->
  <polygon points="12,73 54,45 60,53 18,81" fill="#F58220" />

  <!-- Segunda Viga Diagonal (Laranja Oficial Work) -->
  <polygon points="45,69 64,55 78,70 59,81" fill="#F58220" />

  <!-- Coluna Direita Corpo -->
  <polygon points="68,33 78,29 88,33 88,80 68,80" fill="#ECA580" />

  <!-- Coluna Direita Capitel Laranja -->
  <polygon points="68,33 78,29 88,33 88,45 68,45" fill="#D35400" />
  <polygon points="68,33 78,29 88,33 78,36" fill="#F58220" />

  <!-- Linha Arquitetônica Divisória -->
  <line x1="51" y1="48" x2="58" y2="57" stroke="#111111" stroke-width="2.5" />
</svg>
